# Cloudflare Pages — SCLS Campus Shop (Vite SPA)
name = "scls-campus-shop"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# 兼容 Dashboard 误配 deploy command = `npx wrangler deploy` 的情况
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[vars]
# 前端构建时如需注入环境变量，可在 Cloudflare Dashboard → Pages → Settings → Environment variables 配置
