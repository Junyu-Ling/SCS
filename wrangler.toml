# Cloudflare Workers 静态站点 — SCLS Campus Shop (Vite SPA)
# Git 连 Workers 时 Deploy command 填: npx wrangler deploy
# name 必须与 Cloudflare 上的 Worker 名一致
name = "scs"
compatibility_date = "2024-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[vars]
# 前端构建时如需注入环境变量，可在 Cloudflare Dashboard → Pages → Settings → Environment variables 配置
